name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'ShiauweiZhao/github-stats-extended'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge official upstream updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/stats-organization/github-stats-extended.git
          git fetch --prune upstream master
          git merge --no-edit upstream/master
          git push origin HEAD:master
