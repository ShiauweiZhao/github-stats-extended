name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'ShiauweiZhao/github-stats-extended'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward from official upstream
        run: |
          git remote add upstream https://github.com/stats-organization/github-stats-extended.git
          git fetch --prune upstream master
          git merge --ff-only upstream/master
          git push origin HEAD:master
